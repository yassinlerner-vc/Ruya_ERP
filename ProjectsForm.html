<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; color: #1a1a2e; font-size: 14px; }
    .view { display: none; padding: 20px 24px 100px; }
    .view.active { display: block; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e2e4ef; position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 16px; font-weight: 700; }

    .btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #d0d3e0; background: #fff; color: #1a1a2e; transition: background 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover:not(:disabled) { background: #f0f2fa; }
    .btn:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
    .btn-primary { background: #4361ee; color: #fff; border-color: #4361ee; }
    .btn-primary:hover:not(:disabled) { background: #2f4bcc; }
    .btn-success { background: #1e8a4a; color: #fff; border-color: #1e8a4a; }
    .btn-success:hover:not(:disabled) { background: #166b39; }
    .btn-danger { background: #fff; color: #c0392b; border-color: #c0392b; }
    .btn-danger:hover:not(:disabled) { background: #fdecea; }
    .btn-ghost { background: none; border: none; color: #4361ee; font-weight: 600; font-size: 13px; cursor: pointer; padding: 7px 4px; }
    .btn-ghost:hover { text-decoration: underline; }
    .btn-sm { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #d0d3e0; background: #fff; display: inline-flex; align-items: center; gap: 4px; }
    .btn-sm-primary { border-color: #4361ee; color: #4361ee; }
    .btn-sm-primary:hover { background: #eef0fd; }
    .btn-sm-danger { border-color: #c0392b; color: #c0392b; }
    .btn-sm-danger:hover { background: #fdecea; }

    .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; flex-shrink: 0; }
    .btn-primary .spinner, .btn-success .spinner { border-top-color: #fff; }
    .btn-danger .spinner { border-color: rgba(195,57,43,0.3); border-top-color: #c0392b; }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-label { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .proc-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: #4361ee; z-index: 999; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
    .proc-bar.active { transform: scaleX(0.85); }
    .proc-bar.done { transform: scaleX(1); transition: transform 0.15s ease; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; z-index: 998; display: none; white-space: nowrap; }
    .toast-info { background: #e8ecfd; color: #2f4bcc; border: 1px solid #c5cdf9; }
    .toast-success { background: #d1f2e1; color: #0f5132; border: 1px solid #a3cfbb; }
    .toast-error { background: #f8d7da; color: #842029; border: 1px solid #f1aeb5; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-unpaid { background: #f8d7da; color: #842029; }
    .badge-partially-paid { background: #fff3cd; color: #856404; }
    .badge-fully-paid { background: #d1f2e1; color: #0f5132; }
    .badge-distributed { background: #e8ecfd; color: #2f4bcc; }
    .badge-fulfilled { background: #d1f2e1; color: #0f5132; }
    .badge-free { background: #e8ecfd; color: #2f4bcc; }
    .badge-needs-review { background: #fff3cd; color: #856404; }
    .badge-pending-delivery { background: #fff3cd; color: #856404; }
    .badge-mode-pct { background: #e8ecfd; color: #2f4bcc; }
    .badge-mode-fixed { background: #f0f2fa; color: #555; border: 1px solid #d0d3e0; padding: 2px 9px; }

    .free-note { background: #eef0fd; border: 1px solid #c5cdf9; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #2f4bcc; margin-bottom: 14px; }

    .delivery-box { border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .delivery-box.pending { background: #fff8e6; border: 1px solid #ffe4a3; }
    .delivery-box.confirmed { background: #f0f9f4; border: 1px solid #bfe5cc; }
    .delivery-box.legacy { background: #f5f6fa; border: 1px solid #e2e4ef; }
    .delivery-status { font-size: 13px; font-weight: 700; }
    .delivery-status.pending { color: #856404; }
    .delivery-status.confirmed { color: #0f5132; }
    .delivery-sub { font-size: 12px; color: #888; margin-top: 2px; }

    .filter-tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-tab { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #d0d3e0; background: #fff; color: #888; }
    .filter-tab.active { background: #4361ee; color: #fff; border-color: #4361ee; }
    .filter-tab:hover:not(.active) { background: #f0f2fa; color: #4361ee; }

    .list-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .list-count { font-size: 13px; color: #666; }
    .table-wrap { overflow-x: auto; }
    table.main-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e4ef; }
    table.main-table thead th { background: #4361ee; color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    table.main-table tbody tr:nth-child(odd) { background: #fff; }
    table.main-table tbody tr:nth-child(even) { background: #f8f9ff; }
    table.main-table tbody tr:hover { background: #eef0fd; cursor: pointer; }
    table.main-table tbody td { padding: 10px 12px; border-bottom: 1px solid #e2e4ef; vertical-align: middle; }
    .col-id { width: 90px; font-weight: 700; color: #4361ee; }
    .col-amt { width: 110px; text-align: right; }
    .col-status { width: 130px; }
    .col-date { width: 100px; color: #666; }
    .col-acts { width: 90px; text-align: right; }

    .section { background: #fff; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; border: 1px solid #e2e4ef; }
    h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #4361ee; margin-bottom: 12px; }

    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .meta-cell { font-size: 12px; }
    .meta-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 3px; }
    .meta-value { color: #1a1a2e; font-weight: 600; }

    .items-ref-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .items-ref-table th { background: #f0f2fa; color: #555; padding: 7px 10px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid #e2e4ef; }
    .items-ref-table td { padding: 8px 10px; border-bottom: 1px solid #f0f2fa; vertical-align: top; }

    .paid-banner { display: flex; align-items: center; justify-content: space-between; background: #f8f9ff; border: 1px solid #e2e4ef; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .paid-banner-stat { text-align: center; }
    .paid-banner-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 2px; }
    .paid-banner-value { font-size: 16px; font-weight: 700; color: #1a1a2e; }
    .paid-banner-value.green { color: #1e8a4a; }
    .paid-banner-value.orange { color: #856404; }

    .payments-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
    .payments-table th { background: #f0f2fa; color: #555; padding: 7px 10px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid #e2e4ef; }
    .payments-table td { padding: 8px 10px; border-bottom: 1px solid #f0f2fa; vertical-align: middle; }
    .payments-table .col-amt { text-align: right; font-weight: 600; }
    .payments-table .col-acts { text-align: right; }

    .dist-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
    .dist-table th { background: #f0f2fa; color: #555; padding: 7px 10px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid #e2e4ef; }
    .dist-table td { padding: 8px 10px; border-bottom: 1px solid #f0f2fa; vertical-align: middle; }
    .dist-table .col-amt { text-align: right; font-weight: 600; }
    .dist-table .col-pct { text-align: right; color: #888; font-size: 12px; }
    .dist-table .col-acts { text-align: right; }
    .dist-table .col-basis { width: 110px; }
    .dist-table tfoot td { font-weight: 700; border-top: 2px solid #e2e4ef; border-bottom: none; background: #fafbff; }
    .dist-progress { font-size: 12px; color: #666; margin: 8px 0 12px; }
    .dist-progress strong { color: #1a1a2e; }
    .dist-progress.match strong { color: #1e8a4a; }
    .dist-progress.mismatch strong { color: #c0392b; }

    .inline-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .inline-row select { min-width: 180px; padding: 6px 9px; font-size: 13px; border: 1px solid #d0d3e0; border-radius: 5px; }
    .inline-row input { width: 120px; padding: 6px 9px; font-size: 13px; border: 1px solid #d0d3e0; border-radius: 5px; }

    .mode-toggle { display: inline-flex; border: 1px solid #d0d3e0; border-radius: 5px; overflow: hidden; flex-shrink: 0; }
    .mode-toggle button { padding: 6px 12px; font-size: 12px; font-weight: 700; border: none; background: #fff; color: #888; cursor: pointer; font-family: inherit; }
    .mode-toggle button + button { border-left: 1px solid #d0d3e0; }
    .mode-toggle button.active { background: #4361ee; color: #fff; }
    .mode-toggle button:hover:not(.active) { background: #f0f2fa; color: #4361ee; }

    .locked-note { font-size: 12px; color: #888; padding: 10px 0; }

    .badge-owed { background: #fff3cd; color: #856404; }
    .badge-ledger { background: #f0f2fa; color: #555; border: 1px solid #d0d3e0; padding: 2px 9px; }
    .pay-choice { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .pay-choice select, .inline-row select.pay-sel { min-width: 0; width: auto; padding: 4px 8px; font-size: 12px; }
    .dist-lock-note { background: #fff8e6; border: 1px solid #f0dfa8; color: #7a5b00; border-radius: 6px; padding: 9px 12px; font-size: 12px; line-height: 1.5; margin-bottom: 10px; }
    .dist-owed-note { font-size: 12px; color: #856404; margin: 0 0 12px; }

    .form-actions { display: flex; gap: 8px; align-items: center; padding: 12px 24px; background: #fff; border-top: 1px solid #e2e4ef; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9; }
    .spacer { flex: 1; }
    .hidden { display: none !important; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .dialog { background: #fff; border-radius: 10px; padding: 24px 28px; max-width: 400px; width: 92%; }
    .dialog h4 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
    .dialog p { font-size: 13px; color: #555; margin-bottom: 16px; line-height: 1.5; }
    .dialog-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #555; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 7px 10px; font-size: 13px; border: 1px solid #d0d3e0; border-radius: 5px; background: #fff; color: #1a1a2e; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #4361ee; }
    textarea { resize: vertical; min-height: 50px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .empty-state { text-align: center; padding: 40px; color: #888; font-size: 13px; }
  </style>
</head>
<body>

<div class="proc-bar" id="procBar"></div>
<div class="toast" id="toast"></div>

<div class="topbar">
  <div class="topbar-title" id="topbarTitle">Projects</div>
</div>

<!-- ═══ LIST VIEW ═══ -->
<div class="view active" id="viewList">
  <div class="list-toolbar">
    <div class="list-count" id="listCount">Loading...</div>
  </div>
  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">All</button>
    <button class="filter-tab" data-filter="Needs Review" onclick="setFilter('Needs Review')">🟣 Needs Review</button>
    <button class="filter-tab" data-filter="Unpaid" onclick="setFilter('Unpaid')">🔴 Unpaid</button>
    <button class="filter-tab" data-filter="Partially Paid" onclick="setFilter('Partially Paid')">🟡 Partially Paid</button>
    <button class="filter-tab" data-filter="Fully Paid" onclick="setFilter('Fully Paid')">🟢 Fully Paid</button>
  </div>
  <div class="table-wrap">
    <table class="main-table" id="listTable">
      <thead>
        <tr>
          <th class="col-id">Quotation</th>
          <th>Client</th>
          <th>Project</th>
          <th class="col-amt">Total</th>
          <th class="col-amt">Paid</th>
          <th class="col-status">Status</th>
          <th class="col-acts"></th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="7" style="text-align:center;padding:32px;color:#888;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ═══ PROJECT DETAIL VIEW ═══ -->
<div class="view" id="viewProject">
  <div class="section" id="projectSummary"></div>

  <div id="freeNote"></div>

  <div class="section">
    <h3>Delivery</h3>
    <div id="deliveryBody"></div>
  </div>

  <div class="section">
    <h3>Scope of Work</h3>
    <div id="itemsRefTable"></div>
  </div>

  <div class="section" id="sectionPayments">
    <h3>Payments</h3>
    <div id="paidBanner"></div>
    <div id="paymentsTableWrap"></div>
    <button class="btn btn-primary" id="btnAddPayment" onclick="openAddPayment()">+ Record Payment</button>
  </div>

  <div class="section" id="sectionDistribution">
    <h3>Revenue Distribution</h3>
    <div id="distributionArea"></div>
  </div>
</div>

<!-- ═══ FORM ACTIONS ═══ -->
<div class="form-actions hidden" id="formActions">
  <button class="btn btn-ghost" onclick="showList()">← Back</button>
  <div class="spacer"></div>
</div>

<!-- ═══ RECORD PAYMENT DIALOG ═══ -->
<div class="overlay" id="overlayPayment">
  <div class="dialog">
    <h4>Record Payment</h4>
    <div class="field"><label>Amount</label><input type="text" id="payAmount" inputmode="numeric" autocomplete="off" placeholder="0.00"></div>
    <div class="field hidden" id="payEgpWrap">
      <label id="payEgpLabel">EGP Equivalent Received</label>
      <input type="text" id="payEgpEquivalent" inputmode="numeric" autocomplete="off" placeholder="0.00">
      <div id="payRateDisplay" style="font-size:11px;color:#888;margin-top:4px;"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="payDate"></div>
      <div class="field"><label>Method</label><select id="payMethod"></select></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="payNotes" placeholder="Optional..."></textarea></div>
    <div class="dialog-btns">
      <button class="btn" onclick="closeDialog('overlayPayment')">Cancel</button>
      <button class="btn btn-primary" id="btnPaymentSave" onclick="submitPayment()">
        <div class="spinner"></div><span class="btn-label">Save Payment</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══ DELETE PAYMENT DIALOG ═══ -->
<div class="overlay" id="overlayDeletePayment">
  <div class="dialog">
    <h4>Delete Payment</h4>
    <p>This removes the payment record. It cannot be undone.</p>
    <div class="dialog-btns">
      <button class="btn" onclick="closeDialog('overlayDeletePayment')">Cancel</button>
      <button class="btn btn-danger" id="btnDeletePaymentConfirm" onclick="confirmDeletePayment()">
        <div class="spinner"></div><span class="btn-label">Yes, Delete</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══ DELIVERY CONFIRMATION DIALOG ═══ -->
<div class="overlay" id="overlayDelivery">
  <div class="dialog">
    <h4 id="deliveryDialogTitle">Confirm Delivery</h4>
    <div class="field">
      <label>Delivery Date</label>
      <input type="date" id="deliveryDateInput">
      <div id="deliveryDateError" style="color:#c0392b;font-size:12px;margin-top:4px;"></div>
    </div>
    <div class="dialog-btns">
      <button class="btn" onclick="closeDialog('overlayDelivery')">Cancel</button>
      <button class="btn btn-success" id="btnDeliverySave" onclick="submitDelivery()">
        <div class="spinner"></div><span class="btn-label">Confirm</span>
      </button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let allProjects   = [];
let activeFilter  = 'all';
let currentDetail = null;
let currentProjectId = null;
let deletePaymentId  = null;
let draftDistribution = [];   // rows: { personId, personName, mode: 'percent'|'amount', percent, amount }
let distEditing = false;
let distMode = 'percent';     // which mode the "Add" row is currently set to
let distSelectedPerson = '';  // keeps the person dropdown stable across re-renders
let distPayChoice = '';       // 'PAID' | 'DEFERRED' | '' — payment choice applied to the next row added
let distPayMethod = 'Cash';   // method used when the next row is added as "Paid now"
let PAY_METHODS = ['Cash', 'Bank Transfer', 'Instapay', 'Vodafone Cash', 'Other'];  // refreshed from the server on load

// Rounding slack (in piastres) when deciding whether a distribution "adds up".
// Mirrors the server's tolerance, which absorbs it into the largest percent row.
const DIST_TOL_CENTS = 5;

/* ══════════════════════════════════════════════════════
   CALCULATOR-STYLE AMOUNT INPUTS
   Same pattern as Quotations' subtotal field — digit-by-digit
   entry, comma-formatted display, no way to type invalid
   characters. Tracks any number of fields independently by id.
══════════════════════════════════════════════════════ */
const _amountCents = {};
function initAmountInput(id) {
  _amountCents[id] = 0;
  const el = document.getElementById(id);
  el.value = '';
  el.addEventListener('keydown', function(e) {
    const allowed = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
    if (allowed.includes(e.key)) {
      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        _amountCents[id] = Math.floor(_amountCents[id] / 10);
        renderAmountInput(id);
      }
      return;
    }
    if (!/^\d$/.test(e.key)) { e.preventDefault(); return; }
    e.preventDefault();
    const next = _amountCents[id] * 10 + parseInt(e.key, 10);
    if (next > 99999999999) return;
    _amountCents[id] = next;
    renderAmountInput(id);
  });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const digits = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
    for (const d of digits) {
      const next = _amountCents[id] * 10 + parseInt(d, 10);
      if (next <= 99999999999) _amountCents[id] = next;
    }
    renderAmountInput(id);
  });
  el.addEventListener('focus', () => {
    setTimeout(() => el.setSelectionRange(el.value.length, el.value.length), 0);
  });
}
function renderAmountInput(id) {
  document.getElementById(id).value = fmt(_amountCents[id] / 100);
  onAmountInputChange(id);
}
function getAmountValue(id) { return (_amountCents[id] || 0) / 100; }
function setAmountValue(id, val) {
  _amountCents[id] = Math.round((Number(val) || 0) * 100);
  document.getElementById(id).value = fmt(_amountCents[id] / 100);
}
function onAmountInputChange(id) {
  if (id === 'payAmount' || id === 'payEgpEquivalent') updatePayRateDisplay();
}

/* ══════════════════════════════════════════════════════
   PROCESSING / TOAST
══════════════════════════════════════════════════════ */
function startProcessing(btn, msg) {
  document.getElementById('procBar').className = 'proc-bar active';
  showToast(msg || 'Loading…', 'info', 0);
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
}
function stopProcessing(btn) {
  const bar = document.getElementById('procBar');
  bar.className = 'proc-bar done';
  setTimeout(() => { bar.className = 'proc-bar'; }, 400);
  if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
}
let toastTimer = null;
function showToast(msg, type, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast toast-' + (type||'info'); t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  if (duration !== 0) toastTimer = setTimeout(() => { t.style.display = 'none'; }, duration || 3500);
}
function hideToast() { document.getElementById('toast').style.display = 'none'; }

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
function init() {
  showToast('Loading…', 'info', 0);
  initAmountInput('payAmount');
  initAmountInput('payEgpEquivalent');
  google.script.run
    .withSuccessHandler(renderList)
    .withFailureHandler(err => showToast('Load error: ' + err.message, 'error'))
    .getProjects();
}

/* ══════════════════════════════════════════════════════
   LIST
══════════════════════════════════════════════════════ */
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  renderList(allProjects);
}
function renderList(projects) {
  allProjects = projects || [];
  hideToast();
  const filtered = activeFilter === 'all' ? allProjects
    : activeFilter === 'Needs Review' ? allProjects.filter(p => p.status === 'Needs Review')
    : allProjects.filter(p => p.paymentStatus === activeFilter);
  document.getElementById('listCount').textContent = filtered.length + ' project' + (filtered.length !== 1 ? 's' : '');
  const tbody = document.getElementById('listBody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#888;">No projects found.</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(p => {
    const sk = statusKey(p.paymentStatus);
    const statusBadgeHtml = p.status === 'Fulfilled' ? ' <span class="badge badge-fulfilled">✓ Fulfilled</span>'
      : p.status === 'Needs Review' ? ' <span class="badge badge-needs-review">Needs Review</span>'
      : (p.isDistributed ? ' <span class="badge badge-distributed">Distributed</span>' : '');
    const deliveryBadgeHtml = (!p.deliveredDate && p.status !== 'Fulfilled') ? ' <span class="badge badge-pending-delivery">Delivery pending</span>' : '';
    return `<tr onclick="openProject('${esc(p.projectId)}')">
      <td class="col-id">${esc(p.quotationId)}</td>
      <td><strong>${esc(p.accountName)}</strong></td>
      <td>${esc(p.projectName)}${statusBadgeHtml}${deliveryBadgeHtml}</td>
      <td class="col-amt">${p.isFree ? 'Free' : esc(p.currency) + ' ' + fmt(p.totalAmount)}</td>
      <td class="col-amt">${p.isFree ? '—' : esc(p.currency) + ' ' + fmt(p.amountPaid)}</td>
      <td class="col-status"><span class="badge badge-${sk}">${esc(p.paymentStatus)}</span></td>
      <td class="col-acts"><button class="btn-sm btn-sm-primary" onclick="event.stopPropagation();openProject('${esc(p.projectId)}')">Open →</button></td>
    </tr>`;
  }).join('');
}
function showList() {
  switchView('list');
  document.getElementById('topbarTitle').textContent = 'Projects';
  document.getElementById('formActions').classList.add('hidden');
  google.script.run.withSuccessHandler(renderList).getProjects();
}

/* ══════════════════════════════════════════════════════
   OPEN PROJECT
══════════════════════════════════════════════════════ */
function openProject(projectId) {
  currentProjectId = projectId;
  startProcessing(null, 'Loading project…');
  google.script.run
    .withSuccessHandler(detail => {
      stopProcessing(null); hideToast();
      if (!detail) { showToast('Could not load project.', 'error'); return; }
      currentDetail = detail;
      distEditing = false;
      distMode = 'percent';
      distSelectedPerson = '';
      distPayChoice = '';
      renderProjectDetail(detail);
      switchView('project');
      document.getElementById('topbarTitle').textContent = detail.project.quotationId + ' — ' + detail.project.projectName;
      document.getElementById('formActions').classList.remove('hidden');
    })
    .withFailureHandler(err => { stopProcessing(null); showToast('Error: ' + err.message, 'error'); })
    .getProjectDetail(projectId);
}

function renderProjectDetail(detail) {
  const p = detail.project;
  document.getElementById('projectSummary').innerHTML = `
    <h3>Project Overview</h3>
    <div class="meta-grid">
      <div class="meta-cell"><div class="meta-label">Client</div><div class="meta-value">${esc(p.accountName)}</div></div>
      <div class="meta-cell"><div class="meta-label">Project</div><div class="meta-value">${esc(p.projectName)}</div></div>
      <div class="meta-cell"><div class="meta-label">Quotation</div><div class="meta-value">${esc(p.quotationId)}</div></div>
      <div class="meta-cell"><div class="meta-label">Due Date</div><div class="meta-value">${p.dueDate||'—'}</div></div>
      <div class="meta-cell"><div class="meta-label">Deadline</div><div class="meta-value">${p.deliveryDeadline||'—'}</div></div>
      <div class="meta-cell"><div class="meta-label">Total Amount</div><div class="meta-value">${p.isFree ? 'Free' : esc(p.currency) + ' ' + fmt(p.totalAmount)}</div></div>
      <div class="meta-cell"><div class="meta-label">Status</div><div class="meta-value">${statusBadge(p.status)}</div></div>
      ${p.projectDesc ? `<div class="meta-cell" style="grid-column:1/-1;"><div class="meta-label">Description</div><div class="meta-value" style="font-weight:400;color:#555;">${esc(p.projectDesc)}</div></div>` : ''}
    </div>`;

  document.getElementById('freeNote').innerHTML = p.isFree
    ? '<div class="free-note">This project is free, so no payment collection or revenue distribution applies.</div>'
    : '';

  renderDeliveryBlock(p);
  renderItemsRef(detail.items);

  document.getElementById('sectionPayments').classList.toggle('hidden', p.isFree);
  document.getElementById('sectionDistribution').classList.toggle('hidden', p.isFree);
  if (!p.isFree) {
    renderPayments(detail);
    renderDistribution(detail);
  }
}
function statusBadge(status) {
  if (status === 'Fulfilled')    return '<span class="badge badge-fulfilled">✓ Fulfilled</span>';
  if (status === 'Needs Review') return '<span class="badge badge-needs-review">Needs Review</span>';
  return esc(status);
}

/* ══════════════════════════════════════════════════════
   DELIVERY
   Applies to ALL projects. A free project's delivery
   confirmation is also its fulfillment trigger (server-side);
   a normal project's is one of three independent gates.
══════════════════════════════════════════════════════ */
function renderDeliveryBlock(p) {
  const editLocked = p.isFree && p.status === 'Fulfilled';
  let bodyHtml;
  if (p.deliveredDate) {
    bodyHtml = `
      <div class="delivery-box confirmed">
        <div class="delivery-status confirmed">Delivered on ${esc(p.deliveredDate)}</div>
        ${editLocked ? '' : `<button class="btn-sm btn-sm-primary" onclick="openDeliveryDialog()">Edit date</button>`}
      </div>`;
  } else if (p.status === 'Fulfilled') {
    // Legacy — already Fulfilled before delivery tracking existed.
    bodyHtml = `
      <div class="delivery-box legacy">
        <div>
          <div class="delivery-status" style="color:#888;">Not recorded</div>
          <div class="delivery-sub">Delivered before delivery tracking was added.</div>
        </div>
      </div>`;
  } else {
    bodyHtml = `
      <div class="delivery-box pending">
        <div class="delivery-status pending">Delivery not confirmed</div>
        <button class="btn-sm btn-sm-primary" onclick="openDeliveryDialog()">Confirm delivery</button>
      </div>`;
  }
  document.getElementById('deliveryBody').innerHTML = bodyHtml;
}
function openDeliveryDialog() {
  const p = currentDetail.project;
  const input = document.getElementById('deliveryDateInput');
  const todayStr = new Date().toISOString().split('T')[0];
  input.value = p.deliveredDate || todayStr;
  input.max = todayStr;
  if (p.quotationDateIssued) { input.min = p.quotationDateIssued; } else { input.removeAttribute('min'); }
  document.getElementById('deliveryDateError').textContent = '';
  document.getElementById('deliveryDialogTitle').textContent = p.deliveredDate ? 'Edit Delivery Date' : 'Confirm Delivery';
  document.getElementById('overlayDelivery').classList.add('open');
}
function submitDelivery() {
  const p = currentDetail.project;
  const dateStr = document.getElementById('deliveryDateInput').value;
  const errEl = document.getElementById('deliveryDateError');
  const todayStr = new Date().toISOString().split('T')[0];
  errEl.textContent = '';
  if (!dateStr) { errEl.textContent = 'A delivery date is required.'; return; }
  if (dateStr > todayStr) { errEl.textContent = 'Delivery date cannot be in the future.'; return; }
  if (p.quotationDateIssued && dateStr < p.quotationDateIssued) {
    errEl.textContent = 'Cannot be before the quotation date (' + p.quotationDateIssued + ').'; return;
  }
  const btn = document.getElementById('btnDeliverySave');
  startProcessing(btn, 'Saving...');
  google.script.run
    .withSuccessHandler(res => {
      stopProcessing(btn);
      if (!res.success) { showToast(res.error || 'Failed.', 'error'); return; }
      closeDialog('overlayDelivery');
      showToast('Delivery confirmed.', 'success');
      openProject(currentProjectId);
    })
    .withFailureHandler(err => { stopProcessing(btn); showToast('Error: ' + err.message, 'error'); })
    .confirmDelivery(currentProjectId, dateStr);
}

}

   PAYMENTS

function renderPayments(detail) {
  const p = detail.project;
  const remaining = detail.remainingToPay;
  const isFull = detail.isFullyPaid;
  const isForeign = p.currency !== 'EGP';

  document.getElementById('paidBanner').innerHTML = `
    <div class="paid-banner">
      <div class="paid-banner-stat"><div class="paid-banner-label">Total</div><div class="paid-banner-value">${esc(p.currency)} ${fmt(p.totalAmount)}</div></div>
      <div class="paid-banner-stat"><div class="paid-banner-label">Paid</div><div class="paid-banner-value green">${esc(p.currency)} ${fmt(detail.amountPaid)}</div></div>
      <div class="paid-banner-stat"><div class="paid-banner-label">Remaining</div><div class="paid-banner-value ${remaining > 0 ? 'orange' : ''}">${esc(p.currency)} ${fmt(remaining)}</div></div>
    </div>`;

  } else {
    wrap.innerHTML = `
      <table class="payments-table">
        <thead><tr>
          <th>Date</th><th>Amount</th>

          <th>Method</th><th>Notes</th><th>Recorded By</th><th class="col-acts"></th>
        </tr></thead>
        <tbody>
          ${detail.payments.map(pm => `<tr>
            <td>${pm.date || '—'}</td>
            <td class="col-amt">${esc(p.currency)} ${fmt(pm.amount)}</td>
            ${isForeign ? `
            <td class="col-amt">${pm.egpEquivalent ? 'EGP ' + fmt(pm.egpEquivalent) : '—'}</td>
            <td style="color:#888;font-size:12px;">${pm.exchangeRate ? pm.exchangeRate.toFixed(4) : '—'}</td>` : ''}
            <td>${esc(pm.method || '—')}</td>
            <td style="color:#555;">${esc(pm.notes || '—')}</td>
            <td style="color:#888;font-size:12px;">${esc(pm.recordedBy)}</td>
            <td class="col-acts"><button class="btn-sm btn-sm-danger" onclick="askDeletePayment('${esc(pm.paymentId)}')">Delete</button></td>
          </tr>`).join('')}

  document.getElementById('btnAddPayment').classList.toggle('hidden', isFull);

function openAddPayment() {
  setAmountValue('payAmount', 0);
  setAmountValue('payEgpEquivalent', 0);
  document.getElementById('payRateDisplay').textContent = '';
  document.getElementById('payDate').valueAsDate = new Date();
  document.getElementById('payNotes').value = '';
  const isForeign = currentDetail.project.currency !== 'EGP';
  document.getElementById('payEgpWrap').classList.toggle('hidden', !isForeign);
  document.getElementById('payEgpLabel').textContent = 'EGP Equivalent Received (' + currentDetail.project.currency + ' → EGP)';
  const sel = document.getElementById('payMethod');
  if (!sel.options.length) {
    google.script.run.withSuccessHandler(methods => {
      sel.innerHTML = '<option value="">Select method...</option>' + (methods||[]).map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    }).getPaymentMethods();
  }
  document.getElementById('overlayPayment').classList.add('open');
}
function updatePayRateDisplay() {
  const amount = getAmountValue('payAmount');
  const egp = getAmountValue('payEgpEquivalent');
  const el = document.getElementById('payRateDisplay');
  if (amount > 0 && egp > 0) {
    el.textContent = 'Exchange rate: 1 ' + currentDetail.project.currency + ' = ' + (egp / amount).toFixed(4) + ' EGP';
  } else {
    el.textContent = '';
  }
}
function submitPayment() {
  const amount = getAmountValue('payAmount');
  const date   = document.getElementById('payDate').value;
  const method = document.getElementById('payMethod').value;
  const isForeign = currentDetail.project.currency !== 'EGP';
  const egpEquivalent = isForeign ? getAmountValue('payEgpEquivalent') : '';
  if (!amount || amount <= 0) { showToast('Enter a valid amount.', 'error'); return; }
  if (!date)   { showToast('Select a date.', 'error'); return; }
  if (!method) { showToast('Select a payment method.', 'error'); return; }
  if (isForeign && (!egpEquivalent || egpEquivalent <= 0)) { showToast('Enter the EGP equivalent received.', 'error'); return; }

  const btn = document.getElementById('btnPaymentSave');
  startProcessing(btn, 'Saving payment...');
  google.script.run
    .withSuccessHandler(res => {
      stopProcessing(btn);
      if (!res.success) { showToast(res.error || 'Failed.', 'error'); return; }
      closeDialog('overlayPayment');
      showToast('Payment recorded.', 'success');
      openProject(currentProjectId);
    })
    .withFailureHandler(err => { stopProcessing(btn); showToast('Error: ' + err.message, 'error'); })
    .recordPayment(currentProjectId, {
      amount, date, method, egpEquivalent,
      notes: document.getElementById('payNotes').value
    });
}
function askDeletePayment(paymentId) {
  deletePaymentId = paymentId;
  document.getElementById('overlayDeletePayment').classList.add('open');
}
function confirmDeletePayment() {
  const btn = document.getElementById('btnDeletePaymentConfirm');
  startProcessing(btn, 'Deleting...');
  google.script.run
    .withSuccessHandler(res => {
      stopProcessing(btn);
      closeDialog('overlayDeletePayment');
      if (!res.success) { showToast(res.error || 'Cannot delete.', 'error'); return; }
      showToast('Payment deleted.', 'success');
      openProject(currentProjectId);
    })
    .withFailureHandler(err => { stopProcessing(btn); showToast('Error: ' + err.message, 'error'); })
    .deletePayment(deletePaymentId);
}

/* ══════════════════════════════════════════════════════
   REVENUE DISTRIBUTION
   Each row is either a % share of the EGP actually collected
   or a fixed EGP amount ("mixed mode"). Everything is computed
   in whole piastres so mixed rows always reconcile to the pool.
══════════════════════════════════════════════════════ */
function poolCentsOf(detail) { return Math.round((detail.totalEgpCollected || 0) * 100); }

// EGP value of a row, in piastres
function rowCents(r, poolCents) {
  return r.mode === 'amount'
    ? Math.round((Number(r.amount) || 0) * 100)
    : Math.round(poolCents * (Number(r.percent) || 0) / 100);
}
// Percent a row represents (entered for % rows, derived for fixed rows)
function rowPercent(r, poolCents) {
  if (r.mode !== 'amount') return Number(r.percent) || 0;
  return poolCents > 0 ? rowCents(r, poolCents) / poolCents * 100 : 0;
}
function fmtPct(n) { return (Math.round((Number(n) || 0) * 100) / 100) + '%'; }
function basisBadge(mode) {
  return mode === 'amount'
    ? '<span class="badge badge-mode-fixed">Fixed</span>'
    : '<span class="badge badge-mode-pct">% Share</span>';
}
function pctCell(r, poolCents) {
  const pct = rowPercent(r, poolCents);
  return (r.mode === 'amount' ? '≈ ' : '') + fmtPct(pct);
}

function renderDistribution(detail) {
  const area = document.getElementById('distributionArea');
  const p = detail.project;

  if (!detail.isFullyPaid) {
    area.innerHTML = '<p class="locked-note">Distribute revenue once this project is fully paid.</p>';
    return;
  }

  if (detail.distribution.length && !distEditing) {
    const isForeign = p.currency !== 'EGP';
    const poolCents = poolCentsOf(detail);
    // Saved rows: amount is the stored EGP figure; percent is stored too.
    const saved = detail.distribution.map(d => ({
      personName: d.personName, mode: d.mode,
      percent: d.percent, amount: d.amount,
      payState: d.payState, remaining: d.remaining
    }));
    const totalOwed = saved.reduce((s, r) => s + (Number(r.remaining) || 0), 0);
    const totalAmt = saved.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const totalPct = poolCents > 0 ? Math.round(totalAmt * 100) / poolCents * 100 : 0;
    area.innerHTML = `
      ${isForeign ? `<p class="locked-note" style="padding-top:0;margin-bottom:10px;">Distributed from EGP ${fmt(detail.totalEgpCollected)} actually collected (project total ${esc(p.currency)} ${fmt(p.totalAmount)}).</p>` : ''}
      <table class="dist-table">
        <thead><tr><th>Person</th><th class="col-basis">Basis</th><th class="col-amt">Amount (EGP)</th><th class="col-pct">%</th><th>Payment</th></tr></thead>
        <tbody>
          ${saved.map(d => `<tr>
            <td><strong>${esc(d.personName)}</strong></td>
            <td class="col-basis">${basisBadge(d.mode)}</td>
            <td class="col-amt">EGP ${fmt(d.amount)}</td>
            <td class="col-pct">${d.mode === 'amount' ? '≈ ' : ''}${fmtPct(d.percent)}</td>
            <td>${payBadge(d)}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr>
          <td colspan="2">Total</td>
          <td class="col-amt">EGP ${fmt(totalAmt)}</td>
          <td class="col-pct">${fmtPct(totalPct)}</td>
          <td></td>
        </tr></tfoot>
      </table>
      ${totalOwed > 0.004 ? `<p class="dist-owed-note">EGP ${fmt(totalOwed)} is allocated but not yet paid out to the team — pay it from the member's profile in the Team module.</p>` : ''}
      ${detail.payoutsLocked
        ? `<div class="dist-lock-note">🔒 Payments have already been made against this distribution, so it is locked. To change it, undo those payments from the team member's profile (Team module).</div>`
        : `<button class="btn" onclick="enterDistEdit()">Edit Distribution</button>`}`;
    return;
  }

  // Editing mode
  if (!distEditing) {
    draftDistribution = [];
    distEditing = true;
  }
  renderDistEditor(detail);
}

function enterDistEdit() {
  draftDistribution = currentDetail.distribution.map(d => ({
    personId:   d.personId,
    personName: d.personName,
    mode:       d.mode === 'amount' ? 'amount' : 'percent',
    percent:    d.mode === 'amount' ? 0 : d.percent,
    amount:     d.mode === 'amount' ? d.amount : 0,
    isPartner:  !!d.isPartner,
    status:     d.isPartner ? null : (d.payState === 'paid' ? 'PAID' : 'DEFERRED'),
    method:     'Cash'
  }));
  distEditing = true;
  renderDistEditor(currentDetail);
}

// Allocation summary for the current draft
function draftTotals(detail) {
  const poolCents = poolCentsOf(detail);
  const allocated = draftDistribution.reduce((s, r) => s + rowCents(r, poolCents), 0);
  const remaining = poolCents - allocated;           // + = left to allocate, − = over
  return { poolCents, allocated, remaining };
}
function distMatches(detail) {
  const t = draftTotals(detail);
  return draftDistribution.length > 0 && t.poolCents > 0 && Math.abs(t.remaining) <= DIST_TOL_CENTS;
}

function renderDistEditor(detail) {
  const area = document.getElementById('distributionArea');
  const p = detail.project;
  const egpPool = detail.totalEgpCollected || 0;
  const isForeign = p.currency !== 'EGP';
  const members = detail.teamMembers || [];
  const t = draftTotals(detail);
  const matchClass = distMatches(detail) ? 'match' : 'mismatch';
  const allocPct = t.poolCents > 0 ? t.allocated / t.poolCents * 100 : 0;
  const remPct   = t.poolCents > 0 ? Math.abs(t.remaining) / t.poolCents * 100 : 0;

  const rowsHtml = draftDistribution.map((r, idx) => `
    <tr>
      <td><strong>${esc(r.personName)}</strong></td>
      <td class="col-basis">${basisBadge(r.mode)}</td>
      <td class="col-amt">EGP ${fmt(rowCents(r, t.poolCents) / 100)}</td>
      <td class="col-pct">${pctCell(r, t.poolCents)}</td>
      <td>${r.isPartner
        ? '<span class="badge badge-ledger">Via Ledger</span>'
        : `<div class="pay-choice">
            <select class="pay-sel" onchange="setRowPay(${idx}, this.value)">
              ${r.status ? '' : '<option value="" selected disabled>Choose…</option>'}
              <option value="PAID"${r.status === 'PAID' ? ' selected' : ''}>Paid now</option>
              <option value="DEFERRED"${r.status === 'DEFERRED' ? ' selected' : ''}>Pay later</option>
            </select>
            <select class="pay-sel" id="rowMethod_${idx}" style="${r.status === 'PAID' ? '' : 'display:none;'}" onchange="setRowMethod(${idx}, this.value)">${methodOptionsHtml(r.method)}</select>
          </div>`}</td>
      <td class="col-acts"><button class="btn-sm btn-sm-danger" onclick="removeDistRow(${idx})">Remove</button></td>
    </tr>`).join('');

  let statusText;
  if (Math.abs(t.remaining) <= DIST_TOL_CENTS && draftDistribution.length) {
    statusText = ' ✓';
  } else if (t.remaining > 0) {
    statusText = ' — EGP ' + fmt(t.remaining / 100) + ' (' + fmtPct(remPct) + ') remaining';
  } else {
    statusText = ' — over by EGP ' + fmt(-t.remaining / 100) + ' (' + fmtPct(remPct) + ')';
  }

  const selId = distSelectedPerson || (members[0] ? members[0].id : '');

  area.innerHTML = `
    ${isForeign ? `<p class="locked-note" style="padding-top:0;margin-bottom:10px;">Distributing EGP ${fmt(egpPool)} actually collected (project total ${esc(p.currency)} ${fmt(p.totalAmount)}) — not a fresh conversion of the quotation total.</p>` : ''}
    <table class="dist-table">
      <thead><tr><th>Person</th><th class="col-basis">Basis</th><th class="col-amt">Amount (EGP)</th><th class="col-pct">%</th><th>Payment</th><th class="col-acts"></th></tr></thead>
      <tbody>${rowsHtml || '<tr><td colspan="6" style="text-align:center;color:#888;">No one added yet.</td></tr>'}</tbody>
    </table>
    <div class="dist-progress ${matchClass}">
      Allocated: <strong>EGP ${fmt(t.allocated / 100)}</strong> (${fmtPct(allocPct)}) of EGP ${fmt(egpPool)}${statusText}
    </div>
    <div class="inline-row">
      <select id="distPersonSelect" onchange="onDistPersonChange(this.value)">${members.map(m => `<option value="${esc(m.id)}" data-name="${esc(m.name)}"${m.id === selId ? ' selected' : ''}>${esc(m.name)}${m.role ? ' (' + esc(m.role) + ')' : ''}</option>`).join('')}</select>
      <div class="mode-toggle">
        <button type="button" id="distModePct" class="${distMode === 'percent' ? 'active' : ''}" onclick="setDistMode('percent')">%</button>
        <button type="button" id="distModeAmt" class="${distMode === 'amount' ? 'active' : ''}" onclick="setDistMode('amount')">EGP</button>
      </div>
      <input type="text" id="distValueInput" placeholder="${distMode === 'amount' ? 'EGP amount' : '%'}" inputmode="decimal" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addDistRow();}">
      <span class="pay-choice" id="distPayWrap">
        <select class="pay-sel" id="distPayStatusSel" onchange="setDistPayChoice(this.value)">
          <option value=""${distPayChoice === '' ? ' selected' : ''} disabled>Payment…</option>
          <option value="PAID"${distPayChoice === 'PAID' ? ' selected' : ''}>Paid now</option>
          <option value="DEFERRED"${distPayChoice === 'DEFERRED' ? ' selected' : ''}>Pay later</option>
        </select>
        <select class="pay-sel" id="distPayMethodSel" style="display:none;" onchange="distPayMethod = this.value">${methodOptionsHtml(distPayMethod)}</select>
      </span>
      <button class="btn-sm btn-sm-primary" onclick="addDistRow()">+ Add</button>
      <button class="btn-sm" onclick="distributeRest()">Distribute Rest to Selected</button>
    </div>
    <p class="locked-note" style="padding-bottom:0;">Mix freely: percentages are of the EGP ${fmt(egpPool)} collected, fixed amounts are in EGP. The total must add up to the full amount. For each team member choose <strong>Paid now</strong> (recorded as paid today) or <strong>Pay later</strong> (allocated, shown as their balance in the Team module). Partners are settled through the Ledger.</p>
    <div class="dialog-btns" style="margin-top:16px;">
      <button class="btn" onclick="cancelDistEdit()">Cancel</button>
      <button class="btn btn-success" id="btnSaveDist" onclick="submitDistribution()">
        <div class="spinner"></div><span class="btn-label">Save Distribution</span>
      </button>
    </div>`;
  syncAddPayControls();
}

/* ── Payment choice helpers (Paid now / Pay later) ───────── */
function memberOf(id) {
  return ((currentDetail && currentDetail.teamMembers) || []).find(m => m.id === id) || null;
}
function methodOptionsHtml(selected) {
  return PAY_METHODS.map(m => `<option value="${esc(m)}"${m === selected ? ' selected' : ''}>${esc(m)}</option>`).join('');
}
function payBadge(d) {
  if (d.payState === 'partner')  return '<span class="badge badge-ledger">Via Ledger</span>';
  if (d.payState === 'paid')     return '<span class="badge badge-fully-paid">Paid</span>';
  if (d.payState === 'partial')  return '<span class="badge badge-owed">Partly paid · EGP ' + fmt(d.remaining) + ' owed</span>';
  return '<span class="badge badge-owed">Pay later · EGP ' + fmt(d.remaining) + ' owed</span>';
}
function setRowPay(idx, v) {
  const r = draftDistribution[idx];
  if (!r) return;
  r.status = v;
  const m = document.getElementById('rowMethod_' + idx);
  if (m) m.style.display = v === 'PAID' ? '' : 'none';
}
function setRowMethod(idx, v) { if (draftDistribution[idx]) draftDistribution[idx].method = v; }
function onDistPersonChange(id) { distSelectedPerson = id; syncAddPayControls(); }
function setDistPayChoice(v) { distPayChoice = v; syncAddPayControls(); }
function syncAddPayControls() {
  const sel = document.getElementById('distPersonSelect');
  const wrap = document.getElementById('distPayWrap');
  const meth = document.getElementById('distPayMethodSel');
  if (!sel || !wrap) return;
  const m = memberOf(sel.value);
  wrap.style.display = (m && m.isPartner) ? 'none' : '';
  if (meth) meth.style.display = distPayChoice === 'PAID' ? '' : 'none';
}
// Reads the "Payment…" controls for the person about to be added.
function readAddPay(personId, personName) {
  const m = memberOf(personId);
  if (m && m.isPartner) return { ok: true, isPartner: true, status: null, method: '' };
  if (!distPayChoice) {
    showToast('Choose Paid now or Pay later for ' + personName + '.', 'error');
    return { ok: false };
  }
  return { ok: true, isPartner: false, status: distPayChoice, method: distPayMethod };
}

function setDistMode(mode) {
  distMode = mode === 'amount' ? 'amount' : 'percent';
  document.getElementById('distModePct').classList.toggle('active', distMode === 'percent');
  document.getElementById('distModeAmt').classList.toggle('active', distMode === 'amount');
  const input = document.getElementById('distValueInput');
  input.placeholder = distMode === 'amount' ? 'EGP amount' : '%';
  input.focus();
}

// Adds value to a person's row. One row per person: adding more to
// someone already in the list tops up that row if the basis matches;
// a different basis is refused rather than silently converting.
function upsertDistRow(personId, personName, mode, value, pay) {
  const existing = draftDistribution.find(r => r.personId === personId);
  if (existing) {
    if (existing.mode !== mode) {
      showToast(personName + ' is already added as ' + (existing.mode === 'amount' ? 'a fixed amount' : 'a % share') + ' — remove that row first to change the basis.', 'error');
      return false;
    }
    if (mode === 'amount') existing.amount = Math.round((existing.amount + value) * 100) / 100;
    else existing.percent = Math.round((existing.percent + value) * 10000) / 10000;
    return true;
  }
  draftDistribution.push({
    personId, personName, mode,
    percent: mode === 'percent' ? value : 0,
    amount:  mode === 'amount'  ? value : 0,
    isPartner: !!(pay && pay.isPartner),
    status:    pay ? pay.status : null,
    method:    pay && pay.method ? pay.method : 'Cash'
  });
  return true;
}

function addDistRow() {
  const sel = document.getElementById('distPersonSelect');
  const valEl = document.getElementById('distValueInput');
  if (!sel.options.length) { showToast('No team members found. Add some in the Team module first.', 'error'); return; }
  const value = safe(valEl.value);
  if (!value || value <= 0) {
    showToast(distMode === 'amount' ? 'Enter a valid EGP amount.' : 'Enter a valid percentage.', 'error');
    return;
  }
  if (distMode === 'percent' && value > 100) { showToast('A percentage cannot exceed 100%.', 'error'); return; }
  const personId = sel.value;
  const personName = sel.options[sel.selectedIndex].dataset.name;
  distSelectedPerson = personId;
  const pay = readAddPay(personId, personName);
  if (!pay.ok) return;
  if (!upsertDistRow(personId, personName, distMode, value, pay)) return;
  renderDistEditor(currentDetail);
}

// Gives whatever is still unallocated to the selected person, in the
// currently selected basis (% share or fixed EGP amount).
function distributeRest() {
  const sel = document.getElementById('distPersonSelect');
  if (!sel.options.length) { showToast('No team members found. Add some in the Team module first.', 'error'); return; }
  const t = draftTotals(currentDetail);
  if (t.remaining <= DIST_TOL_CENTS) { showToast('Nothing left to distribute.', 'error'); return; }
  const personId = sel.value;
  const personName = sel.options[sel.selectedIndex].dataset.name;
  distSelectedPerson = personId;
  const value = distMode === 'amount'
    ? t.remaining / 100
    : Math.round(t.remaining / t.poolCents * 100 * 10000) / 10000;
  const pay = readAddPay(personId, personName);
  if (!pay.ok) return;
  if (!upsertDistRow(personId, personName, distMode, value, pay)) return;
  renderDistEditor(currentDetail);
}
function removeDistRow(idx) {
  draftDistribution.splice(idx, 1);
  renderDistEditor(currentDetail);
}
function cancelDistEdit() {
  distEditing = false;
  draftDistribution = [];
  renderDistribution(currentDetail);
}
function submitDistribution() {
  if (!draftDistribution.length) { showToast('Add at least one person to distribute to.', 'error'); return; }
  const t = draftTotals(currentDetail);
  if (Math.abs(t.remaining) > DIST_TOL_CENTS) {
    showToast(t.remaining > 0
      ? 'EGP ' + fmt(t.remaining / 100) + ' is still unallocated.'
      : 'Distribution is over by EGP ' + fmt(-t.remaining / 100) + '.', 'error');
    return;
  }
  // Send only the field that was the input for each row; the server
  // recomputes the EGP figures from the pool and reconciles rounding.
  const unchosen = draftDistribution.find(r => !r.isPartner && !r.status);
  if (unchosen) { showToast('Choose Paid now or Pay later for ' + unchosen.personName + '.', 'error'); return; }
  const payload = draftDistribution.map(r => {
    const base = r.mode === 'amount'
      ? { personId: r.personId, personName: r.personName, mode: 'amount',  amount: r.amount }
      : { personId: r.personId, personName: r.personName, mode: 'percent', percent: r.percent };
    if (!r.isPartner) {                       // partners are settled via the Ledger
      base.status = r.status;
      if (r.status === 'PAID') base.method = r.method || 'Cash';
    }
    return base;
  });

  const btn = document.getElementById('btnSaveDist');
  startProcessing(btn, 'Saving distribution...');
  google.script.run
    .withSuccessHandler(res => {
      stopProcessing(btn);
      if (!res.success) { showToast(res.error || 'Failed.', 'error'); return; }
      showToast('Revenue distributed.', 'success');
      distEditing = false;
      openProject(currentProjectId);
    })
    .withFailureHandler(err => { stopProcessing(btn); showToast('Error: ' + err.message, 'error'); })
    .saveDistribution(currentProjectId, payload);
}

/* ══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════ */
function switchView(name) {
  document.getElementById('viewList').classList.toggle('active', name === 'list');
  document.getElementById('viewProject').classList.toggle('active', name === 'project');
}
function closeDialog(id) { document.getElementById(id).classList.remove('open'); }
function statusKey(s) { return String(s||'').toLowerCase().replace(/\s+/g, '-'); }
function fmt(n) { return Number(n||0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function safe(v) { return Number(String(v).replace(/,/g, '')) || 0; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

google.script.run.withSuccessHandler(m => { if (m && m.length) PAY_METHODS = m; }).getPaymentMethods();
init();
</script>
</body>
</html>
